# AsyncAPI 契約骨架 — 複製到專案後改名：asyncapi-<domain>-v<N>.yaml
# 傳遞語意（ordering、冪等、retry、DLQ、schema 演進）見 event_spec.md；事件 schema 以本檔為準。
asyncapi: 3.0.0
info:
  title: "[領域] 事件契約"
  version: 1.0.0
  description: |
    Producer 與 consumer 的責任、失敗行為見 event_spec.md §3–4。
channels:
  work-order-events:
    address: work-order-events
    messages:
      workOrderAssigned:
        $ref: "#/components/messages/WorkOrderAssigned"
    description: 排序鍵 workOrderId；DLQ 為 work-order-events-dlq
operations:
  publishWorkOrderAssigned:
    action: send
    channel:
      $ref: "#/channels/work-order-events"
    summary: dispatch-service 於狀態轉移 pending→assigned 時發布
components:
  messages:
    WorkOrderAssigned:
      name: work_order.assigned
      title: 工單已指派
      contentType: application/json
      payload:
        $ref: "#/components/schemas/WorkOrderAssignedPayload"
  schemas:
    WorkOrderAssignedPayload:
      type: object
      required: [eventId, eventType, eventVersion, occurredAt, payload]
      properties:
        eventId:
          type: string
          format: uuid
          description: 冪等鍵；consumer 以此去重
        eventType:
          type: string
          const: work_order.assigned
        eventVersion:
          type: string
          const: "1.0"
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          required: [workOrderId, assigneeId]
          properties:
            workOrderId: { type: string, format: uuid }
            assigneeId: { type: string, format: uuid }
